<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Dr. Skientist: Book of Hints (WebAR)</title>
  <!-- A-Frame & AR.js for Marker-Based WebAR -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
      background: #1b2234;
      color: #2d2638;
    }

    /* Ensure A-Frame canvas stays underneath interactive HUD */
    a-scene,
    .a-canvas,
    video {
      z-index: 1 !important;
    }

    /* Top Lab HUD */
    .hud-header {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 9999;
      pointer-events: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 248, 236, 0.96);
      border: 3px solid #f59e0b;
      border-radius: 20px;
      padding: 10px 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }
    .hud-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.05rem;
      color: #b45309;
      line-height: 1.1;
    }
    .hud-sub {
      font-size: 0.78rem;
      color: #6b5b7b;
      font-weight: 700;
    }
    .mode-btn {
      background: #10b981;
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 8px 12px;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.82rem;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      box-shadow: 0 3px 0 #047857;
    }
    .mode-btn:active { transform: translateY(2px); }

    /* Bottom Interactive Hint Controls */
    .hud-controls {
      position: fixed;
      bottom: 18px;
      left: 14px;
      right: 14px;
      z-index: 9999;
      pointer-events: auto;
      background: rgba(255, 248, 236, 0.96);
      border: 3px solid #38bdf8;
      border-radius: 24px;
      padding: 14px 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      text-align: center;
    }
    .puzzle-tabs {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 10px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 6px;
      border-radius: 14px;
      border: 2px solid #cbd5e1;
      background: #f8fafc;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.82rem;
      color: #475569;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
    }
    .tab-btn.active {
      background: #38bdf8;
      border-color: #0284c7;
      color: #ffffff;
    }
    .clue-preview-box {
      background: #fffbeb;
      border: 2px dashed #f59e0b;
      border-radius: 16px;
      padding: 10px 12px;
      margin-bottom: 10px;
      min-height: 64px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .clue-stage-label {
      font-family: 'Fredoka', sans-serif;
      font-size: 0.78rem;
      color: #d97706;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .clue-text {
      font-size: 0.92rem;
      font-weight: 700;
      color: #1e293b;
      margin-top: 2px;
    }
    .action-row {
      display: flex;
      gap: 10px;
    }
    .hint-btn {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 16px;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.92rem;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
    }
    .next-clue-btn {
      background: #f59e0b;
      color: #fff;
      box-shadow: 0 4px 0 #b45309;
    }
    .audio-btn {
      background: #8b5cf6;
      color: #fff;
      box-shadow: 0 4px 0 #6d28d9;
      max-width: 120px;
    }

    /* Scanning Guide Pill */
    .scan-pill {
      position: fixed;
      top: 84px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9990;
      background: rgba(15, 23, 42, 0.78);
      color: #fef3c7;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- Top HUD -->
  <div class="hud-header">
    <div>
      <div class="hud-title">Dr. Skienst's Hint Codex</div>
      <div class="hud-sub" id="statusText">Point camera at Book Marker</div>
    </div>
    <button type="button" class="mode-btn" id="togglePreviewBtn">2D Card Mode</button>
  </div>

  <div class="scan-pill" id="scanPill">Aim at the HIRO marker in the Book of Hints</div>

  <!-- AR Scene -->
  <a-scene
    id="arScene"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true;">

    <a-marker preset="hiro" id="hintMarker">
      <!-- 3D Hint Notebook Assembly -->
      <a-entity id="hintNotebook" position="0 0.14 0"
                animation="property: position; to: 0 0.22 0; dir: alternate; dur: 1800; loop: true; easing: easeInOutSine">
        <!-- Notebook Cover Base -->
        <a-box position="0 0 0" width="2.55" height="0.1" depth="1.78" color="#B45309" material="roughness: 0.55"></a-box>
        <!-- Corner Gold Accents -->
        <a-box position="-1.22 0.01 -0.84" width="0.14" height="0.12" depth="0.14" color="#FBBF24"></a-box>
        <a-box position="1.22 0.01 -0.84" width="0.14" height="0.12" depth="0.14" color="#FBBF24"></a-box>
        <a-box position="-1.22 0.01 0.84" width="0.14" height="0.12" depth="0.14" color="#FBBF24"></a-box>
        <a-box position="1.22 0.01 0.84" width="0.14" height="0.12" depth="0.14" color="#FBBF24"></a-box>

        <!-- Left & Right Open Pages -->
        <a-box position="-0.61 0.09 0" width="1.15" height="0.1" depth="1.6" rotation="0 0 -3" color="#FFFDF7" material="roughness: 0.85"></a-box>
        <a-box position="0.61 0.09 0" width="1.15" height="0.1" depth="1.6" rotation="0 0 3" color="#FFFDF7" material="roughness: 0.85"></a-box>

        <!-- Subtle Ruled Lines Across Both Pages -->
        <a-box position="-0.61 0.145 -0.45" width="0.92" height="0.006" depth="0.018" rotation="0 0 -3" color="#CBD5E1"></a-box>
        <a-box position="-0.61 0.145 -0.15" width="0.92" height="0.006" depth="0.018" rotation="0 0 -3" color="#CBD5E1"></a-box>
        <a-box position="-0.61 0.145 0.15" width="0.92" height="0.006" depth="0.018" rotation="0 0 -3" color="#CBD5E1"></a-box>
        <a-box position="-0.61 0.145 0.45" width="0.92" height="0.006" depth="0.018" rotation="0 0 -3" color="#CBD5E1"></a-box>

        <a-box position="0.61 0.145 -0.45" width="0.92" height="0.006" depth="0.018" rotation="0 0 3" color="#CBD5E1"></a-box>
        <a-box position="0.61 0.145 -0.15" width="0.92" height="0.006" depth="0.018" rotation="0 0 3" color="#CBD5E1"></a-box>
        <a-box position="0.61 0.145 0.15" width="0.92" height="0.006" depth="0.018" rotation="0 0 3" color="#CBD5E1"></a-box>
        <a-box position="0.61 0.145 0.45" width="0.92" height="0.006" depth="0.018" rotation="0 0 3" color="#CBD5E1"></a-box>

        <!-- Center Spine Crease & Bookmark Ribbon -->
        <a-box position="0 0.07 0" width="0.12" height="0.13" depth="1.64" color="#78350F"></a-box>
        <a-box position="0.22 0.16 0.12" width="0.1" height="0.02" depth="1.66" rotation="0 0 2" color="#EF4444"></a-box>

        <!-- Left Page Diagram: Atom / Lab Sketch + Badge -->
        <a-entity id="leftPageVisual" position="-0.61 0.22 -0.05" rotation="-90 0 0">
          <a-ring id="atomRing" color="#38BDF8" radius-inner="0.22" radius-outer="0.26"></a-ring>
          <a-ring id="atomOrbit" color="#38BDF8" radius-inner="0.12" radius-outer="0.14" position="0 0 0.005"></a-ring>
          <a-circle id="nucleusDot" color="#F59E0B" radius="0.07" position="0 0 0.01"></a-circle>
          <a-text id="leftSymbol" value="O=8 C=6" position="0 -0.36 0.01" align="center" color="#0F172A" width="1.35"></a-text>
        </a-entity>

        <!-- Right Page Prop: Beaker / Flask + Code Tag -->
        <a-entity id="rightPageVisual" position="0.61 0.22 -0.38" rotation="-90 0 0">
          <a-circle id="pageFlaskBase" color="#38BDF8" radius="0.18" position="0 0.06 0.01"></a-circle>
          <a-ring id="pageFlaskRim" color="#64748B" radius-inner="0.18" radius-outer="0.21" position="0 0.06 0.015"></a-ring>
          <a-text id="rightTag" value="8-6-1" position="0 -0.22 0.01" align="center" color="#B45309" width="1.25"></a-text>
        </a-entity>

        <!-- Floating Lab Orbs Beside Notebook -->
        <a-sphere position="-1.42 0.26 -0.45" radius="0.13" color="#38BDF8"
                  animation="property: position; to: -1.42 0.38 -0.45; dir: alternate; dur: 1400; loop: true"></a-sphere>
        <a-sphere position="1.42 0.26 0.45" radius="0.12" color="#10B981"
                  animation="property: position; to: 1.42 0.38 0.45; dir: alternate; dur: 1700; loop: true"></a-sphere>

        <!-- Floating AR Title -->
        <a-text
          id="arTitle"
          value="PUZZLE 1: THE PERIODIC LOCK"
          position="0 0.30 -0.62"
          rotation="-90 0 0"
          align="center"
          color="#B45309"
          width="2.2">
        </a-text>

        <!-- Floating AR Clue Body -->
        <a-text
          id="arBody"
          value="Look closely at the lab wall chart! Find Oxygen (O) and Carbon (C)."
          position="0.61 0.28 0.22"
          rotation="-90 0 0"
          align="center"
          color="#1E293B"
          width="1.05"
          wrap-count="22">
        </a-text>

        <!-- Stage Badge -->
        <a-text
          id="arBadge"
          value="[ GENTLE NUDGE (1/3) ]"
          position="0 0.30 0.66"
          rotation="-90 0 0"
          align="center"
          color="#0284C7"
          width="1.95">
        </a-text>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- Bottom Interactive HUD -->
  <div class="hud-controls">
    <div class="puzzle-tabs">
      <button type="button" class="tab-btn active" data-puzzle="0">1. Periodic Lock</button>
      <button type="button" class="tab-btn" data-puzzle="1">2. Potion pH</button>
      <button type="button" class="tab-btn" data-puzzle="2">3. States of Matter</button>
    </div>

    <div class="clue-preview-box">
      <div class="clue-stage-label" id="hudStage">Puzzle 1 • Gentle Nudge (1/3)</div>
      <div class="clue-text" id="hudClueText">
        Look closely at the lab wall chart! Find Oxygen (O) and Carbon (C).
      </div>
    </div>

    <div class="action-row">
      <button type="button" class="hint-btn next-clue-btn" id="nextClueBtn">Reveal Stronger Hint</button>
      <button type="button" class="hint-btn audio-btn" id="audioBtn">Listen</button>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const puzzles = [
        {
          title: "PUZZLE 1: THE PERIODIC LOCK",
          clues: [
            "Look closely at the lab wall chart! Find Oxygen (O) and Carbon (C).",
            "Each element's atomic number tells you how many protons it has.",
            "Oxygen = 8, Carbon = 6, Hydrogen = 1. Enter code: 8 - 6 - 1!"
          ]
        },
        {
          title: "PUZZLE 2: POTION pH BALANCE",
          clues: [
            "Dr. Skienst's beaker turned bright red—that means it is an acid!",
            "To neutralise an acid, add a drop from the blue alkaline flask.",
            "Mix Red (pH 2) + Blue (pH 12) until the liquid glows Emerald Green (pH 7)."
          ]
        },
        {
          title: "PUZZLE 3: STATES OF MATTER",
          clues: [
            "The exit hatch is frozen solid! How do we turn ice into steam?",
            "Heat speeds up molecules so they break free from a solid crystal.",
            "Set the Bunsen burner to High Heat twice: Solid -> Liquid -> Gas!"
          ]
        }
      ];

      const pageVisuals = [
        { ring: "#38BDF8", nucleus: "#F59E0B", symbol: "O=8 C=6", flask: "#38BDF8", tag: "8-6-1" },
        { ring: "#F43F5E", nucleus: "#EF4444", symbol: "pH 2", flask: "#10B981", tag: "pH 7" },
        { ring: "#38BDF8", nucleus: "#0284C7", symbol: "ICE", flask: "#F97316", tag: "HEAT" }
      ];

      let currentPuzzle = 0;
      let currentStage = 0;
      let previewOnly = false;

      const arTitle = document.getElementById('arTitle');
      const arBody = document.getElementById('arBody');
      const arBadge = document.getElementById('arBadge');
      const hudStage = document.getElementById('hudStage');
      const hudClueText = document.getElementById('hudClueText');
      const statusText = document.getElementById('statusText');
      const scanPill = document.getElementById('scanPill');
      const marker = document.getElementById('hintMarker');
      const tabButtons = Array.from(document.querySelectorAll('.tab-btn'));
      const nextClueBtn = document.getElementById('nextClueBtn');
      const audioBtn = document.getElementById('audioBtn');
      const togglePreviewBtn = document.getElementById('togglePreviewBtn');

      function updateUI() {
        const p = puzzles[currentPuzzle];
        const text = p.clues[currentStage];
        const stageNames = ["Gentle Nudge", "Lab Clue", "Solution Key"];

        if (arTitle) arTitle.setAttribute('value', p.title);
        if (arBody) arBody.setAttribute('value', text);
        if (arBadge) arBadge.setAttribute('value', `[ ${stageNames[currentStage].toUpperCase()} (${currentStage + 1}/3) ]`);

        const vis = pageVisuals[currentPuzzle];
        const atomRing = document.getElementById('atomRing');
        const atomOrbit = document.getElementById('atomOrbit');
        const nucleusDot = document.getElementById('nucleusDot');
        const leftSymbol = document.getElementById('leftSymbol');
        const pageFlaskBase = document.getElementById('pageFlaskBase');
        const rightTag = document.getElementById('rightTag');

        if (atomRing) atomRing.setAttribute('color', vis.ring);
        if (atomOrbit) atomOrbit.setAttribute('color', vis.ring);
        if (nucleusDot) nucleusDot.setAttribute('color', vis.nucleus);
        if (leftSymbol) leftSymbol.setAttribute('value', vis.symbol);
        if (pageFlaskBase) pageFlaskBase.setAttribute('color', vis.flask);
        if (rightTag) rightTag.setAttribute('value', vis.tag);

        hudStage.textContent = `Puzzle ${currentPuzzle + 1} • ${stageNames[currentStage]} (${currentStage + 1}/3)`;
        hudClueText.textContent = text;

        tabButtons.forEach((btn, idx) => {
          btn.classList.toggle('active', idx === currentPuzzle);
        });
      }

      function selectPuzzle(index) {
        currentPuzzle = index;
        currentStage = 0;
        updateUI();
      }

      function nextClue() {
        currentStage = (currentStage + 1) % puzzles[currentPuzzle].clues.length;
        updateUI();
      }

      function speakClue() {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(puzzles[currentPuzzle].clues[currentStage]);
          utterance.rate = 0.95;
          utterance.pitch = 1.08;
          window.speechSynthesis.speak(utterance);
        }
      }

      tabButtons.forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = Number(btn.getAttribute('data-puzzle'));
          selectPuzzle(idx);
        });
      });

      nextClueBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        nextClue();
      });

      audioBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        speakClue();
      });

      togglePreviewBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        previewOnly = !previewOnly;
        const scene = document.getElementById('arScene');
        if (previewOnly) {
          scene.style.display = 'none';
          togglePreviewBtn.textContent = 'AR Camera Mode';
          statusText.textContent = '2D Quick-Test Mode';
          scanPill.textContent = 'Camera paused — testing hint cards';
        } else {
          scene.style.display = 'block';
          togglePreviewBtn.textContent = '2D Card Mode';
          statusText.textContent = 'Point camera at Book Marker';
          scanPill.textContent = 'Aim at the HIRO marker in the Book of Hints';
        }
      });

      if (marker) {
        marker.addEventListener('markerFound', () => {
          statusText.textContent = "Book Page Detected!";
          scanPill.textContent = "3D Hint Notebook Active";
        });

        marker.addEventListener('markerLost', () => {
          if (!previewOnly) {
            statusText.textContent = "Point camera at Book Marker";
            scanPill.textContent = "Aim at the HIRO marker in the Book of Hints";
          }
        });
      }

      updateUI();
    });
  </script>
</body>
</html>
