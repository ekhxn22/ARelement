<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Dr. Skienst: Book of Hints (WebAR)</title>
  <!-- A-Frame & AR.js for Marker-Based WebAR -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
      background: #1b2234;
      color: #2d2638;
    }

    /* Top Lab HUD */
    .hud-header {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 248, 236, 0.94);
      border: 3px solid #f59e0b;
      border-radius: 20px;
      padding: 10px 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }
    .hud-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.05rem;
      color: #b45309;
      line-height: 1.1;
    }
    .hud-sub {
      font-size: 0.78rem;
      color: #6b5b7b;
      font-weight: 700;
    }
    .mode-btn {
      background: #10b981;
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 8px 12px;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.82rem;
      cursor: pointer;
      box-shadow: 0 3px 0 #047857;
    }
    .mode-btn:active { transform: translateY(2px); }

    /* Bottom Interactive Hint Controls */
    .hud-controls {
      position: fixed;
      bottom: 18px;
      left: 14px;
      right: 14px;
      z-index: 20;
      background: rgba(255, 248, 236, 0.96);
      border: 3px solid #38bdf8;
      border-radius: 24px;
      padding: 14px 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      text-align: center;
    }
    .puzzle-tabs {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 10px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 6px;
      border-radius: 14px;
      border: 2px solid #cbd5e1;
      background: #f8fafc;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.82rem;
      color: #475569;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #38bdf8;
      border-color: #0284c7;
      color: #ffffff;
    }
    .clue-preview-box {
      background: #fffbeb;
      border: 2px dashed #f59e0b;
      border-radius: 16px;
      padding: 10px 12px;
      margin-bottom: 10px;
      min-height: 64px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .clue-stage-label {
      font-family: 'Fredoka', sans-serif;
      font-size: 0.78rem;
      color: #d97706;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .clue-text {
      font-size: 0.92rem;
      font-weight: 700;
      color: #1e293b;
      margin-top: 2px;
    }
    .action-row {
      display: flex;
      gap: 10px;
    }
    .hint-btn {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 16px;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.92rem;
      cursor: pointer;
    }
    .next-clue-btn {
      background: #f59e0b;
      color: #fff;
      box-shadow: 0 4px 0 #b45309;
    }
    .audio-btn {
      background: #8b5cf6;
      color: #fff;
      box-shadow: 0 4px 0 #6d28d9;
      max-width: 120px;
    }

    /* Scanning Guide Pill */
    .scan-pill {
      position: fixed;
      top: 84px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      background: rgba(15, 23, 42, 0.78);
      color: #fef3c7;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Top HUD -->
  <div class="hud-header">
    <div>
      <div class="hud-title">Dr. Skienst's Hint Codex</div>
      <div class="hud-sub" id="statusText">Point camera at Book Marker</div>
    </div>
    <button class="mode-btn" id="togglePreviewBtn">2D Card Mode</button>
  </div>

  <div class="scan-pill" id="scanPill">Aim at the HIRO marker in the Book of Hints</div>

  <!-- AR Scene -->
  <a-scene
    id="arScene"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true;">

    <a-marker preset="hiro" id="hintMarker">
      <!-- 3D Hint Notebook Assembly -->
      <a-entity id="hintNotebook" position="0 0.14 0"
                animation="property: position; to: 0 0.22 0; dir: alternate; dur: 1800; loop: true; easing: easeInOutSine">
        <!-- Notebook Cover Base -->
        <a-box position="0 0 0" width="2.35" height="0.1" depth="1.65" color="#B45309" material="roughness: 0.55"></a-box>
        <!-- Corner Gold Accents -->
        <a-box position="-1.12 0.01 -0.77" width="0.14" height="0.12" depth="0.14" color="#FBBF24"></a-box>
        <a-box position="1.12 0.01 -0.77" width="0.14" height="0.12" depth="0.14" color="#FBBF24"></a-box>
        <a-box position="-1.12 0.01 0.77" width="0.14" height="0.12" depth="0.14" color="#FBBF24"></a-box>
        <a-box position="1.12 0.01 0.77" width="0.14" height="0.12" depth="0.14" color="#FBBF24"></a-box>

        <!-- Left & Right Open Pages -->
        <a-box position="-0.56 0.10 0" width="1.05" height="0.11" depth="1.48" rotation="0 0 -4" color="#FFFDF7" material="roughness: 0.8"></a-box>
        <a-box position="0.56 0.10 0" width="1.05" height="0.11" depth="1.48" rotation="0 0 4" color="#FFFDF7" material="roughness: 0.8"></a-box>

        <!-- Center Spine Crease & Bookmark Ribbon -->
        <a-box position="0 0.06 0" width="0.12" height="0.12" depth="1.52" color="#78350F"></a-box>
        <a-box position="0.28 0.15 0.15" width="0.12" height="0.03" depth="1.56" rotation="0 0 3" color="#EF4444"></a-box>

        <!-- Left Page Visual: Atom Ring & Nucleus Sketch -->
        <a-entity id="leftPageVisual" position="-0.56 0.17 0.22" rotation="-90 0 0">
          <a-ring color="#38BDF8" radius-inner="0.16" radius-outer="0.19"></a-ring>
          <a-circle id="nucleusDot" color="#F59E0B" radius="0.06"></a-circle>
          <a-text id="leftSymbol" value="O=8 C=6" position="0 -0.26 0.01" align="center" color="#0F172A" width="1.2"></a-text>
        </a-entity>

        <!-- Right Page Visual: Puzzle Prop Icon (Flask / pH / States) -->
        <a-entity id="rightPageVisual" position="0.56 0.17 0.22" rotation="0 0 4">
          <a-cylinder id="pageFlaskBase" position="0 0 0" radius="0.14" height="0.06" color="#38BDF8"></a-cylinder>
          <a-cylinder id="pageFlaskNeck" position="0 0.06 0" radius="0.06" height="0.08" color="#E2E8F0"></a-cylinder>
          <a-text id="rightTag" value="8-6-1" position="0 0.04 0.18" rotation="-90 0 0" align="center" color="#B45309" width="1.1"></a-text>
        </a-entity>

        <!-- Floating Lab Orbs Beside Notebook -->
        <a-sphere position="-1.32 0.25 -0.45" radius="0.14" color="#38BDF8"
                  animation="property: position; to: -1.32 0.38 -0.45; dir: alternate; dur: 1400; loop: true"></a-sphere>
        <a-sphere position="1.32 0.25 0.45" radius="0.13" color="#10B981"
                  animation="property: position; to: 1.32 0.38 0.45; dir: alternate; dur: 1700; loop: true"></a-sphere>

        <!-- Floating AR Title -->
        <a-text
          id="arTitle"
          value="PUZZLE 1: THE PERIODIC LOCK"
          position="0 0.24 -0.44"
          rotation="-90 0 0"
          align="center"
          color="#B45309"
          width="2.15">
        </a-text>

        <!-- Floating AR Clue Body -->
        <a-text
          id="arBody"
          value="Look closely at the lab wall chart! Find Oxygen (O) and Carbon (C)."
          position="0 0.25 0.04"
          rotation="-90 0 0"
          align="center"
          color="#1E293B"
          width="1.9"
          wrap-count="32">
        </a-text>

        <!-- Stage Badge -->
        <a-text
          id="arBadge"
          value="[ GENTLE NUDGE (1/3) ]"
          position="0 0.24 0.54"
          rotation="-90 0 0"
          align="center"
          color="#0284C7"
          width="1.9">
        </a-text>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- Bottom Interactive HUD -->
  <div class="hud-controls">
    <div class="puzzle-tabs">
      <button class="tab-btn active" onclick="selectPuzzle(0)">1. Periodic Lock</button>
      <button class="tab-btn" onclick="selectPuzzle(1)">2. Potion pH</button>
      <button class="tab-btn" onclick="selectPuzzle(2)">3. States of Matter</button>
    </div>

    <div class="clue-preview-box">
      <div class="clue-stage-label" id="hudStage">Puzzle 1 • Gentle Nudge (1/3)</div>
      <div class="clue-text" id="hudClueText">
        Look closely at the lab wall chart! Find Oxygen (O) and Carbon (C).
      </div>
    </div>

    <div class="action-row">
      <button class="hint-btn next-clue-btn" onclick="nextClue()">Reveal Stronger Hint</button>
      <button class="hint-btn audio-btn" onclick="speakClue()">Listen</button>
    </div>
  </div>

  <script>
    // Customisable Chemistry Puzzles for Ages 8-14
    const puzzles = [
      {
        title: "PUZZLE 1: THE PERIODIC LOCK",
        clues: [
          "Look closely at the lab wall chart! Find Oxygen (O) and Carbon (C).",
          "Each element's atomic number tells you how many protons it has.",
          "Oxygen = 8, Carbon = 6, Hydrogen = 1. Enter code: 8 - 6 - 1!"
        ]
      },
      {
        title: "PUZZLE 2: POTION pH BALANCE",
        clues: [
          "Dr. Skienst's beaker turned bright red—that means it is an acid!",
          "To neutralise an acid, add a drop from the blue alkaline flask.",
          "Mix Red (pH 2) + Blue (pH 12) until the liquid glows Emerald Green (pH 7)."
        ]
      },
      {
        title: "PUZZLE 3: STATES OF MATTER",
        clues: [
          "The exit hatch is frozen solid! How do we turn ice into steam?",
          "Heat speeds up molecules so they break free from a solid crystal.",
          "Set the Bunsen burner to High Heat twice: Solid -> Liquid -> Gas!"
        ]
      }
    ];

    // Visual diagrams on the left & right notebook pages per puzzle
    const pageVisuals = [
      { nucleus: "#F59E0B", symbol: "O=8 C=6", flask: "#38BDF8", tag: "8-6-1" },
      { nucleus: "#EF4444", symbol: "pH 2", flask: "#10B981", tag: "pH 7" },
      { nucleus: "#38BDF8", symbol: "ICE", flask: "#F97316", tag: "HEAT" }
    ];

    let currentPuzzle = 0;
    let currentStage = 0;
    let previewOnly = false;

    const arTitle = document.getElementById('arTitle');
    const arBody = document.getElementById('arBody');
    const arBadge = document.getElementById('arBadge');
    const hudStage = document.getElementById('hudStage');
    const hudClueText = document.getElementById('hudClueText');
    const statusText = document.getElementById('statusText');
    const scanPill = document.getElementById('scanPill');
    const marker = document.getElementById('hintMarker');

    marker.addEventListener('markerFound', () => {
      statusText.textContent = "Book Page Detected!";
      scanPill.textContent = "3D Hint Notebook Active";
    });

    marker.addEventListener('markerLost', () => {
      if (!previewOnly) {
        statusText.textContent = "Point camera at Book Marker";
        scanPill.textContent = "Aim at the HIRO marker in the Book of Hints";
      }
    });

    function updateUI() {
      const p = puzzles[currentPuzzle];
      const text = p.clues[currentStage];
      const stageNames = ["Gentle Nudge", "Lab Clue", "Solution Key"];

      // Update 3D AR Text
      arTitle.setAttribute('value', p.title);
      arBody.setAttribute('value', text);
      arBadge.setAttribute('value', `[ ${stageNames[currentStage].toUpperCase()} (${currentStage + 1}/3) ]`);

      // Update 3D Notebook Page Visuals
      const vis = pageVisuals[currentPuzzle];
      document.getElementById('nucleusDot').setAttribute('color', vis.nucleus);
      document.getElementById('leftSymbol').setAttribute('value', vis.symbol);
      document.getElementById('pageFlaskBase').setAttribute('color', vis.flask);
      document.getElementById('rightTag').setAttribute('value', vis.tag);

      // Update Bottom HUD Card
      hudStage.textContent = `Puzzle ${currentPuzzle + 1} • ${stageNames[currentStage]} (${currentStage + 1}/3)`;
      hudClueText.textContent = text;

      // Update Active Tab
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx === currentPuzzle);
      });
    }

    function selectPuzzle(index) {
      currentPuzzle = index;
      currentStage = 0;
      updateUI();
    }

    function nextClue() {
      currentStage = (currentStage + 1) % puzzles[currentPuzzle].clues.length;
      updateUI();
    }

    // Built-in Voice Read-Aloud for younger players
    function speakClue() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(puzzles[currentPuzzle].clues[currentStage]);
        utterance.rate = 0.95;
        utterance.pitch = 1.08;
        window.speechSynthesis.speak(utterance);
      }
    }

    // Toggle Camera-Free Preview Mode for easy desktop testing
    document.getElementById('togglePreviewBtn').addEventListener('click', function () {
      previewOnly = !previewOnly;
      const scene = document.getElementById('arScene');
      if (previewOnly) {
        scene.style.display = 'none';
        this.textContent = 'AR Camera Mode';
        statusText.textContent = '2D Quick-Test Mode';
        scanPill.textContent = 'Camera paused — testing hint cards';
      } else {
        scene.style.display = 'block';
        this.textContent = '2D Card Mode';
        statusText.textContent = 'Point camera at Book Marker';
        scanPill.textContent = 'Aim at the HIRO marker in the Book of Hints';
      }
    });

    updateUI();
  </script>
</body>
</html>
